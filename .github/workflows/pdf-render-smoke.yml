# Exercises `renderPdf` + Playwright Chromium (same stack as Forever / Capital Stress `/api/.../report-pdf`).
name: PDF render smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  pdf-render-smoke:
    # ubuntu-latest is 26.04; Playwright 1.58 has no chromium deps for it.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate PDF via renderPdf
        run: npm run ci:pdf-render-smoke
